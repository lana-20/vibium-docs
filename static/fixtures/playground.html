<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vibium docs playground</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; }
  nav a { margin-right: 1rem; }
  label { display: block; margin-top: .75rem; }
</style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#docs">Docs</a>
    <a href="#about">About</a>
  </nav>

  <h1>Playground</h1>
  <p>A fixed page for the examples in this reference.</p>

  <img src="logo.svg" alt="Company logo" width="32" height="32">

  <form>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com">

    <label for="country">Country</label>
    <select id="country" name="country"><option value="us">United States</option><option value="de">Germany</option></select>

    <label><input type="checkbox" id="terms" name="terms"> Accept terms</label>

    <input type="search" name="q" placeholder="Search docs">

    <button type="submit" data-testid="submit-btn">Sign In</button>
    <button type="button" title="Close dialog">×</button>
  </form>

  <h2>Notes</h2>
  <p id="status">Ready</p>
</body>
</html>
